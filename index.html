<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priit Vain</title>
  <meta name="description" content="Priit Vain – software engineer in Tallinn, Estonia.">
  <meta property="og:title" content="Priit Vain">
  <meta property="og:description" content="Software engineer in Tallinn, Estonia.">
  <meta property="og:url" content="https://priit.dev/">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ctext x='32' y='42' font-family='ui-monospace,Menlo,monospace' font-size='28' font-weight='700' text-anchor='middle' fill='%235eead4'%3Epv%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b0f14;
      --fg: #e6edf3;
      --muted: #8b98a5;
      --card: rgba(255, 255, 255, 0.04);
      --card-line: rgba(255, 255, 255, 0.09);
      --accent: #5eead4;
      --blob-1: #0ea5e9;
      --blob-2: #14b8a6;
      --blob-3: #6366f1;
      --dots: rgba(255, 255, 255, 0.06);
      --button-fg: #0b0f14;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f8;
        --fg: #0f172a;
        --muted: #5b6776;
        --card: rgba(255, 255, 255, 0.6);
        --card-line: rgba(15, 23, 42, 0.08);
        --accent: #0f766e;
        --blob-1: #7dd3fc;
        --blob-2: #5eead4;
        --blob-3: #a5b4fc;
        --dots: rgba(15, 23, 42, 0.07);
        --button-fg: #ffffff;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* Slowly drifting colour blobs behind a fine dot grid. */
    .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .blob {
      position: absolute;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 28s ease-in-out infinite alternate;
    }
    .blob:nth-child(1) { background: var(--blob-1); top: -18vmax; left: -12vmax; }
    .blob:nth-child(2) { background: var(--blob-2); bottom: -20vmax; right: -14vmax; animation-delay: -9s; }
    .blob:nth-child(3) { background: var(--blob-3); top: 30%; left: 45%; width: 30vmax; height: 30vmax; animation-delay: -18s; }
    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    @keyframes drift {
      to { transform: translate(8vmax, 6vmax) scale(1.15); }
    }

    .card {
      position: relative;
      width: min(560px, 100%);
      padding: 44px 40px;
      border: 1px solid var(--card-line);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    /* Soft light that follows the pointer across the card. */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--x, 50%) var(--y, 0%), rgba(94, 234, 212, 0.12), transparent 60%);
      pointer-events: none;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .prompt { color: var(--muted); font-size: 0.9rem; margin: 0 0 18px; }
    .prompt span { color: var(--accent); }

    h1 {
      font-size: clamp(2.3rem, 8vw, 3.3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
    }
    .role { font-size: 1.1rem; margin: 0 0 6px; }
    .role .typed { color: var(--accent); }
    .caret {
      display: inline-block;
      width: 0.55em;
      height: 1.1em;
      margin-left: 2px;
      vertical-align: -0.18em;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .place { color: var(--muted); margin: 0 0 32px; }

    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-line);
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .links a:hover { transform: translateY(-2px); border-color: var(--accent); }
    .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: var(--button-fg); }
    .links svg { width: 18px; height: 18px; flex: none; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; border-radius: 20px; }
      .links a { flex: 1; justify-content: center; }
      .links a.primary { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .card, .caret { animation: none; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="dots"></div>
  </div>

  <main class="card">
    <p class="prompt mono" aria-hidden="true"><span>~</span> whoami</p>
    <h1>Priit Vain</h1>
    <p class="role mono"><span class="typed" data-text="software engineer">software engineer</span><span class="caret" aria-hidden="true"></span></p>
    <p class="place">Tallinn, Estonia</p>

    <nav class="links" aria-label="Contact">
      <a class="primary" href="mailto:hello@priit.dev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>
        hello@priit.dev
      </a>
      <a href="https://github.com/priitv">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/priitv">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
        LinkedIn
      </a>
    </nav>
  </main>

  <script>
    // Type the role out once. The full text is already in the HTML, so it reads fine without JavaScript.
    const typed = document.querySelector(".typed");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const text = typed.dataset.text;
      typed.textContent = "";
      [...text].forEach((ch, i) => setTimeout(() => { typed.textContent += ch; }, 500 + i * 65));
    }

    const card = document.querySelector(".card");
    card.addEventListener("pointermove", e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty("--x", `${e.clientX - r.left}px`);
      card.style.setProperty("--y", `${e.clientY - r.top}px`);
    });
  </script>
</body>
</html>
